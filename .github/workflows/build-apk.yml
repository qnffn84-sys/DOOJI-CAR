name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            STORE_PASS=$(grep -A 20 'debugConfig' app/build.gradle.kts | grep -oP 'storePassword\s*=?\s*"\K[^"]+' | head -n 1 || true)
            KEY_ALIAS=$(grep -A 20 'debugConfig' app/build.gradle.kts | grep -oP 'keyAlias\s*=?\s*"\K[^"]+' | head -n 1 || true)
            KEY_PASS=$(grep -A 20 'debugConfig' app/build.gradle.kts | grep -oP 'keyPassword\s*=?\s*"\K[^"]+' | head -n 1 || true)
            STORE_PASS=${STORE_PASS:-android}
            KEY_ALIAS=${KEY_ALIAS:-androiddebugkey}
            KEY_PASS=${KEY_PASS:-android}
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass "$STORE_PASS" -alias "$KEY_ALIAS" -keypass "$KEY_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f "./gradlew" ] || [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
